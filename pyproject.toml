[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-bft-finality-lab"
version = "0.1.0"
description = "Analyze block ancestry, weighted voting certificates, equivocation and conflicting finalized branches."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-bft-finality-lab = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
